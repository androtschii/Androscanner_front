# SPA: неизвестный путь (например /scans/7 при прямом заходе или F5)
# должен отдавать index.html, а не 404 — маршрутизацию берёт на себя
# react-router уже в браузере.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS/CSS от Vite именованы с хешем в имени файла — можно кэшировать
    # надолго, новая версия придёт под новым именем
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
